<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OMEGA REDCap Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: app chrome (sidebar of instruments + toolbar) around a light "paper" form that imitates a REDCap data-entry page. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#17212b; --muted:#5b6774; --line:#d5dbe2; --accent:#0f5e78; --accent-ink:#ffffff; --hover:#e3e8ee;
  --paper:#ffffff; --paper-fg:#1d2329; --paper-muted:#5d6670; --paper-line:#dfe3e8; --paper-alt:#f6f8fa; --sec-bg:#2f3e4c; --sec-fg:#ffffff;
  --m-bg:#e8edf3; --m-fg:#334455; --me-bg:#fdf0dc; --me-fg:#8a4b06; --e-bg:#e2edfb; --e-fg:#1c4f96; --c-bg:#e4f2ea; --c-fg:#1f6b43; --x-bg:#efe6fb; --x-fg:#5b2aa0;
  --warn:#b42318; --ok:#1f6b43;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181e; --panel:#1a222a; --fg:#e4e9ee; --muted:#9aa6b2; --line:#2c3742; --accent:#5fb3cf; --accent-ink:#0d1a20; --hover:#232d37;
  --m-bg:#26313c; --m-fg:#c8d3de; --me-bg:#3a2a12; --me-fg:#f3c27a; --e-bg:#18304f; --e-fg:#9cc3f5; --c-bg:#17352a; --c-fg:#8fd3ae; --x-bg:#2e2145; --x-fg:#cdb3f3;
  --warn:#ff8a7a; --ok:#8fd3ae; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e; --panel:#1a222a; --fg:#e4e9ee; --muted:#9aa6b2; --line:#2c3742; --accent:#5fb3cf; --accent-ink:#0d1a20; --hover:#232d37;
  --m-bg:#26313c; --m-fg:#c8d3de; --me-bg:#3a2a12; --me-fg:#f3c27a; --e-bg:#18304f; --e-fg:#9cc3f5; --c-bg:#17352a; --c-fg:#8fd3ae; --x-bg:#2e2145; --x-fg:#cdb3f3;
  --warn:#ff8a7a; --ok:#8fd3ae; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12.5px}
.search{flex:1 1 220px;max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:6px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:500;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;color:var(--muted);font-size:12.5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.chip.Manual{background:var(--m-bg);color:var(--m-fg)}
.chip.ManualEHR{background:var(--me-bg);color:var(--me-fg)}
.chip.EHR{background:var(--e-bg);color:var(--e-fg)}
.chip.Calc{background:var(--c-bg);color:var(--c-fg)}
.chip.Either{background:var(--x-bg);color:var(--x-fg)}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;
  padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;max-height:calc(100vh - 130px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 8px 6px;font-weight:600}
.navbtn{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:7px 8px;border-radius:6px}
.navbtn:hover{background:var(--hover)}
.navbtn[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.navbtn .nm{font-weight:600;font-size:13.5px;min-width:0}
.navbtn .ct{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.navbtn .bar{grid-column:1/-1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.navsel{display:none;width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:600}
main{min-width:0}
.formhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:12px}
.formhead h2{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.formhead .mono{color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:12px;color:var(--muted);font-size:13px}
.notice b{color:var(--fg)}
.paper{background:var(--paper);color:var(--paper-fg);border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;color-scheme:light}
.paper .chip.Manual{background:#e8edf3;color:#334455}.paper .chip.ManualEHR{background:#fdf0dc;color:#8a4b06}.paper .chip.EHR{background:#e2edfb;color:#1c4f96}.paper .chip.Calc{background:#e4f2ea;color:#1f6b43}.paper .chip.Either{background:#efe6fb;color:#5b2aa0}
.sec{background:var(--sec-bg);color:var(--sec-fg);padding:8px 14px;font-weight:600;font-size:14px}
.row{border-top:1px solid var(--paper-line);padding:12px 14px;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:8px 22px}
.row:nth-child(even of .row){background:var(--paper-alt)}
.row.desc{grid-template-columns:minmax(0,1fr)}
.row.dim{opacity:.45}
.row.hit{box-shadow:inset 3px 0 0 #0f5e78}
.lbl{min-width:0;overflow-wrap:anywhere}
.lbl p{margin:0 0 4px}
.lbl table{max-width:100%;border-collapse:collapse}
.lbl td,.lbl th{border:1px solid #c9ced4;padding:3px 6px;vertical-align:middle}
.req{color:#b42318;font-size:11.5px;font-weight:600;margin-top:3px}
.inp{min-width:0;display:flex;flex-direction:column;gap:5px}
.inp input[type=text],.inp textarea{width:100%;max-width:360px;padding:6px 8px;border:1px solid #b9c1ca;border-radius:4px;background:#fff;color:#1d2329}
.inp textarea{min-height:56px;max-width:100%}
.inp .calc{background:#eef1f4;color:#4a5560;font-style:italic}
.hint{font-size:11.5px;color:var(--paper-muted)}
.inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.minibtn{border:1px solid #b9c1ca;background:#f4f6f8;color:#1d2329;border-radius:4px;padding:3px 8px;font-size:12px}
.opt{display:flex;align-items:flex-start;gap:7px;padding:2px 0}
.opt input{margin-top:3px;accent-color:#0f5e78}
.reset{font-size:11.5px;color:#0f5e78;background:none;border:0;padding:0;text-decoration:underline;align-self:flex-start}
.note{font-size:12.5px;color:var(--paper-muted)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--paper-muted)}
.meta .var{font-family:var(--f-mono);font-size:11.5px;color:#4a5560;background:#eef1f4;padding:1px 6px;border-radius:4px}
.cond{display:inline-flex;gap:5px;align-items:baseline;max-width:100%;color:#41505e}
.cond b{font-weight:600;color:#0f5e78;white-space:nowrap}
.cbtn{margin-left:auto;border:1px solid #b9c1ca;background:#fff;color:#1d2329;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.cbtn.has{background:#0f5e78;border-color:#0f5e78;color:#fff}
.cbox{grid-column:1/-1;border:1px solid #c9d3dc;background:#fbfcfd;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.cmt{display:flex;flex-direction:column;gap:2px;border-left:3px solid #c9d3dc;padding-left:8px}
.cmt .who{font-size:12px;font-weight:600;color:#33414e}
.cmt .who span{font-weight:400;color:#6b7580}
.cmt .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.cbox textarea{width:100%;min-height:60px;padding:6px 8px;border:1px solid #b9c1ca;border-radius:4px;background:#fff;color:#1d2329}
.cbox .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:#5d6670}
.formfoot{border-top:1px solid var(--paper-line);background:var(--paper-alt);padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.formfoot select{padding:5px 8px;border:1px solid #b9c1ca;border-radius:4px;background:#fff;color:#1d2329}
.general{margin-bottom:12px}
.general .cbox{background:var(--panel);border-color:var(--line);color:var(--fg)}
.general .cbox textarea{background:var(--bg);color:var(--fg);border-color:var(--line)}
.general .cmt .who{color:var(--fg)}
.general .cmt{border-color:var(--line)}
.empty{padding:30px 14px;color:var(--paper-muted);text-align:center}
.allc{display:flex;flex-direction:column;gap:14px}
.allc .grp{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.allc .grp h3{margin:0;padding:10px 14px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.allc .item{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.allc .item:first-of-type{border-top:0}
.allc .item .fl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.allc .item .fl a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
.allc .cmt{border-color:var(--line)}
.allc .cmt .who{color:var(--fg)}
.allc .cmt .who span{color:var(--muted)}
.tag-ehrbox{color:#1d2329}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .navsel{display:block;margin-bottom:12px}
  .top{position:static}
}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr)}
  .counts{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  <div class="legend" id="legend"></div>
</header>

<div class="shell">

  <main>
    <select id="navsel" class="navsel" aria-label="Instrument"></select>
    <div id="view"></div>
  </main>
</div>

t","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_self_efficacy","f":"outcomes_patient_reported","s":"","t":"radio","l":"General Self-efficacy","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_health_literacy","f":"outcomes_patient_reported","s":"","t":"radio","l":"Health Literacy","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_prenatal_care_rate","f":"outcomes_patient_reported","s":"","t":"text","l":"Prenatal care attendance (rate, %)","c":"","no":"Percentage of scheduled prenatal visits attended","v":"number_1dp","mn":"0","mx":"100","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_birth_plan","f":"outcomes_patient_reported","s":"","t":"yesno","l":"Documented birth plan","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_support_people","f":"outcomes_patient_reported","s":"","t":"text","l":"Number of support people present at L&D","c":"","no":"","v":"integer","mn":"0","mx":"20","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"pro_doula_client","f":"outcomes_patient_reported","s":"","t":"yesno","l":"Was patient a Doula client","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[pro_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_date","f":"outcomes_patient_usability","s":"","t":"text","l":"Usability Assessment, Date (if done at follow-up)","c":"","no":"","v":"date_mdy","mn":"","mx":"","id":"y","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual Used for: usa_timing_days","m":"Manual"},{"n":"usa_measured","f":"outcomes_patient_usability","s":"Outcomes: Patient Usability","t":"yesno","l":"Patient Usability Assessment, Measured?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_timing_days","f":"outcomes_patient_usability","s":"","t":"text","l":"Patient Usability Assessment, Timing After Delivery Date (days)","c":"","no":"How many days postpartum was the assessment performed? Use a negative number if performed prenatally. If delivery date unknown, compute with respect to expected due date","v":"integer","mn":"-300","mx":"400","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_easy_to_place","f":"outcomes_patient_usability","s":"","t":"radio","l":"The monitor was easy to place and start using.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_comfortable","f":"outcomes_patient_usability","s":"","t":"radio","l":"The monitor was comfortable.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_easy_to_read","f":"outcomes_patient_usability","s":"","t":"radio","l":"The results of the monitoring were easy to read.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_trust_results","f":"outcomes_patient_usability","s":"","t":"radio","l":"I would trust these results to tell me if the baby was getting enough oxygen.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_improves_soc","f":"outcomes_patient_usability","s":"","t":"radio","l":"I believe that this product will significantly improve the current standard of care.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_improves_ld_exp","f":"outcomes_patient_usability","s":"","t":"radio","l":"This device would vastly improve my experiences on labor and delivery (L&D) (patient) and make me more likely to continue to practice on L&D (care team).","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_would_use","f":"outcomes_patient_usability","s":"","t":"radio","l":"Overall, I would want to use this test/would want it used in my care.","c":"1, Strongly Disagree | 2, Disagree | 3, Neutral | 4, Agree | 5, Strongly Agree","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_overall_thoughts","f":"outcomes_patient_usability","s":"","t":"notes","l":"What did you think of the device overall?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_trouble","f":"outcomes_patient_usability","s":"","t":"yesno","l":"Did you have any trouble using it?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_trouble_desc","f":"outcomes_patient_usability","s":"","t":"notes","l":"What kind of trouble did you have?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_trouble] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_confusing","f":"outcomes_patient_usability","s":"","t":"yesno","l":"Was anything confusing?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_confusing_desc","f":"outcomes_patient_usability","s":"","t":"notes","l":"Please tell me about this.","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_confusing] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_change","f":"outcomes_patient_usability","s":"","t":"yesno","l":"Is there anything you would change?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_change_desc","f":"outcomes_patient_usability","s":"","t":"notes","l":"What would you change?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_change] = '1'","rq":"","a":"Fill: Manual","m":"Manual"},{"n":"usa_final_thoughts","f":"outcomes_patient_usability","s":"","t":"notes","l":"Do you have any final thoughts you would like to share?","c":"","no":"","v":"","mn":"","mx":"","id":"","b":"[usa_measured] = '1'","rq":"","a":"Fill: Manual","m":"Manual"}]</script>
<script>
(function(){
const F = JSON.parse(document.getElementById('dd').textContent);
const BY = Object.fromEntries(F.map(f=>[f.n,f]));
const FORMS = [...new Set(F.map(f=>f.f))];
const TITLE = f => f.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const FM = {
  'Manual':{k:'Manual',t:'Manual',d:'Entered by the team'},
  'Manual -> EHR':{k:'ManualEHR',t:'Manual → EHR',d:'Entered by the team, replaced later by EHR data'},
  'EHR (script)':{k:'EHR',t:'From EHR',d:'Filled automatically from the EHR; no need to enter'},
  'Calculated':{k:'Calc',t:'Calculated',d:'Computed by REDCap'},
  'Manual or EHR':{k:'Either',t:'Manual or EHR',d:'Depends on the answer given (see note)'}
};
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = h => { const d=document.createElement('div'); d.innerHTML=String(h||'').replace(/\{[a-z0-9_]+\}/g,''); return (d.textContent||'').replace(/\s+/g,' ').trim(); };
const safeHTML = h => String(h||'').replace(/<\s*\/?\s*(script|iframe|object|embed)[^>]*>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'');
const choices = f => {
  if (f.t==='yesno') return [['1','Yes'],['0','No']];
  if (!f.c || f.t==='calc') return [];
  return f.c.split('|').map(p=>{const i=p.indexOf(',');return [p.slice(0,i).trim(),p.slice(i+1).trim()];});
};
const short = n => { const f=BY[n]; if(!f) return n; let s=strip(f.l); if(s.length>70) s=s.slice(0,67)+'…'; return s||n; };

/* ---------- embedded fields ({var} inside another field's label/note) ---------- */
const EMB = {}; // child -> host
F.forEach(f=>{ (String(f.l)+String(f.no)).replace(/\{([a-z0-9_]+)\}/g,(m,c)=>{ if(BY[c]&&c!==f.n) EMB[c]=f.n; }); });

/* ---------- branching logic: tokenizer + parser ---------- */
function tokenize(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    let m;
    const rest=s.slice(i);
    if((m=rest.match(/^\[([a-z0-9_]+)\](?:\[([a-z0-9_]+)\])?(?:\(([^)]+)\))?/i))){
      const name=m[2]||m[1]; t.push({k:'ref',n:name,c:m[3]}); i+=m[0].length; continue;}
    if(c==="'"||c==='"'){const j=s.indexOf(c,i+1); t.push({k:'lit',v:s.slice(i+1,j<0?s.length:j)}); i=j<0?s.length:j+1; continue;}
    if((m=rest.match(/^(<>|!=|>=|<=|=|>|<)/))){t.push({k:'op',v:m[1]}); i+=m[1].length; continue;}
    if((m=rest.match(/^(and|or)\b/i))){t.push({k:m[1].toLowerCase()}); i+=m[1].length; continue;}
    if(c==='('||c===')'){t.push({k:c}); i++; continue;}
    if((m=rest.match(/^-?\d+(\.\d+)?/))){t.push({k:'lit',v:m[0]}); i+=m[0].length; continue;}
    throw new Error('Cannot read: '+rest.slice(0,20));
  }
  return t;
}
function parse(s){
  const t=tokenize(s); let p=0;
  const peek=()=>t[p], next=()=>t[p++];
  function expr(){ const a=[term()]; while(peek()&&peek().k==='or'){next();a.push(term());} return a.length>1?{or:a}:a[0]; }
  function term(){ const a=[fac()]; while(peek()&&peek().k==='and'){next();a.push(fac());} return a.length>1?{and:a}:a[0]; }
  function operand(){ const x=next(); if(!x||(x.k!=='ref'&&x.k!=='lit')) throw new Error('operand'); return x; }
  function fac(){
    if(peek()&&peek().k==='('){ next(); const e=expr(); if(!peek()||next().k!==')') throw new Error(')'); return e; }
    const l=operand();
    if(peek()&&peek().k==='op'){ const op=next().v; const r=operand(); return {cmp:[l,op,r]}; }
    return {cmp:[l,'<>',{k:'lit',v:''}]};
  }
  const e=expr(); if(p<t.length) throw new Error('extra'); return e;
}
const AST={}; F.forEach(f=>{ if(f.b){ try{AST[f.n]=parse(f.b);}catch(e){AST[f.n]=null;} } });

const VAL={}; // simulated answers: field -> string, checkbox -> Set
function val(x){
  if(x.k==='lit') return x.v;
  const f=BY[x.n];
  if(x.c!==undefined){ const s=VAL[x.n]; return (s instanceof Set && s.has(String(x.c)))?'1':'0'; }
  const v=VAL[x.n]; return v==null?'':String(v);
}
function cmpv(a,op,b){
  const na=a!==''&&!isNaN(+a), nb=b!==''&&!isNaN(+b);
  const A=na&&nb?+a:a, B=na&&nb?+b:b;
  switch(op){case '=':return A==B;case '<>':case '!=':return A!=B;case '>':return A>B;case '<':return A<B;case '>=':return A>=B;case '<=':return A<=B;}
  return false;
}
function ev(e){ if(e.or) return e.or.some(ev); if(e.and) return e.and.every(ev); const [l,op,r]=e.cmp; return cmpv(val(l),op,val(r)); }
function shown(n){
  const host=EMB[n]; if(host) return shown(host);
  const f=BY[n]; if(!f.b) return true; const a=AST[f.n]; if(!a) return true;
  return ev(a);
}
/* plain-language description */
function choiceLabel(n,code){ const f=BY[n]; if(!f) return code; const c=choices(f).find(x=>x[0]===String(code)); return c?c[1]:code; }
function desc(e,top){
  if(e.or) {
    const same=e.or.every(x=>x.cmp&&x.cmp[0].k==='ref'&&x.cmp[0].c===undefined&&x.cmp[1]==='='&&x.cmp[2].k==='lit'&&x.cmp[0].n===e.or[0].cmp[0].n);
    if(same){ const n=e.or[0].cmp[0].n; return '“'+esc(short(n))+'” is one of: '+e.or.map(x=>'“'+esc(choiceLabel(n,x.cmp[2].v))+'”').join(', '); }
    const s=e.or.map(x=>desc(x)).join(' <i>or</i> '); return top?s:'('+s+')'; }
  if(e.and){ const s=e.and.map(x=>desc(x)).join(' <i>and</i> '); return top?s:'('+s+')'; }
  let [l,op,r]=e.cmp;
  if(l.k==='lit'&&r.k==='ref'){ [l,r]=[r,l]; }
  if(l.k!=='ref') return esc(l.v+' '+op+' '+r.v);
  const name='“'+esc(short(l.n))+'”';
  if(l.c!==undefined){
    const opt='“'+esc(choiceLabel(l.n,l.c))+'”';
    const on=(op==='='&&r.v==='1')||((op==='<>'||op==='!=')&&r.v==='0');
    return name+': '+opt+(on?' is checked':' is not checked');
  }
  if(r.k==='lit'&&r.v==='') return name+((op==='='?' is blank':' is filled in'));
  const rv=r.k==='lit'?'“'+esc(choiceLabel(l.n,r.v))+'”':'“'+esc(short(r.n))+'”';
  const w={'=':'is','<>':'is not','!=':'is not','>':'is greater than','<':'is less than','>=':'is at least','<=':'is at most'}[op]||op;
  return name+' '+w+' '+rv;
}

/* ---------- comments store ---------- */
const C={db:null,user:null,me:null,canWrite:null,docs:{},names:{},ready:false,err:''};
const key=(form,n)=>n?n:'_form:'+form;
function commentsFor(k){
  const out=[]; for(const [uid,d] of Object.entries(C.docs)){ const x=d&&d.notes&&d.notes[k]; if(x&&x.t) out.push({uid,t:x.t,at:x.at}); }
  return out.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
}
function countForm(form){ let c=0; for(const d of Object.values(C.docs)){ for(const k of Object.keys((d&&d.notes)||{})){ const n=k.startsWith('_form:')?null:k; const f=n?BY[n]:null; if((f&&f.f===form)||k==='_form:'+form) c++; } } return c; }
let saving=Promise.resolve();
function saveMine(k,text){
  const mine=JSON.parse(JSON.stringify(C.docs[C.me]||{notes:{}})); mine.notes=mine.notes||{};
  if(text&&text.trim()) mine.notes[k]={t:text.trim(),at:new Date().toISOString()}; else delete mine.notes[k];
  mine.updated=new Date().toISOString();
  C.docs[C.me]=mine; // optimistic
  saving=saving.then(()=>C.db.doc('feedback/'+C.me).set(mine)).catch(e=>{ if(e&&e.code==='invalid_argument'){C.canWrite=false;} C.err='Could not save: '+(e&&e.message||'unknown error'); render(); });
  return saving;
}
async function resolveNames(){
  if(!C.user) return; const ids=Object.keys(C.docs); if(!ids.length) return;
  try{ const ps=await C.user.profiles(ids); for(const id of ids){ C.names[id]=(ps[id]&&ps[id].name)||''; } }catch(e){}
}
const nm=uid=>uid===C.me?'You':(C.names[uid]||'Team member');
const when=at=>{ try{ return new Date(at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return '';} };

/* ---------- UI state ---------- */
let current=FORMS[0], open=null, mode='form';
try{ const h=location.hash.slice(1); if(FORMS.includes(h)) current=h; }catch(e){}
const $=id=>document.getElementById(id);

function legend(){
  $('legend').innerHTML='<span>How each field gets filled:</span>'+Object.values(FM).map(m=>`<span class="chip ${m.k}" title="${esc(m.d)}">${esc(m.t)}</span>`).join('')+
   `<span>· Variable names shown in grey boxes</span>`;
  const forms=FORMS.length, nf=F.filter(f=>f.t!=='descriptive').length;
  $('sub').textContent=`Local project · data dictionary v7 · ${forms} instruments · ${nf} fields · draft for team review`;
}
function formStats(form){ const s={}; F.forEach(f=>{ if(f.f===form&&f.t!=='descriptive'){ s[f.m]=(s[f.m]||0)+1; } }); return s; }
const COLORS={'Manual':'#7d8fa3','Manual -> EHR':'#d58a2a','EHR (script)':'#3d7fd6','Calculated':'#3a9a68','Manual or EHR':'#8b5cd6'};
function nav(){
  $('nav').innerHTML=FORMS.map(form=>{
    const s=formStats(form), tot=Object.values(s).reduce((a,b)=>a+b,0), cc=countForm(form);
    const bar=Object.entries(s).map(([k,v])=>`<i style="width:${v/tot*100}%;background:${COLORS[k]||'#999'}"></i>`).join('');
    return `<button class="navbtn" type="button" data-form="${form}" aria-current="${mode==='form'&&form===current}"><span class="nm">${esc(TITLE(form))}</span><span class="ct">${tot}${cc?' · '+cc+' cmt':''}</span><span class="bar">${bar}</span></button>`;
  }).join('');
  $('navsel').innerHTML=FORMS.map(f=>`<option value="${f}" ${f===current?'selected':''}>${esc(TITLE(f))} (${Object.values(formStats(f)).reduce((a,b)=>a+b,0)})</option>`).join('');
  if(mode==='all') $('navsel').value='__all';
}

function inputHTML(f){
  const id='i_'+f.n, ch=choices(f), v=VAL[f.n];
  switch(f.t){
    case 'text':{
      const hint={datetime_mdy:'M-D-Y H:M',date_mdy:'M-D-Y',integer:'Integer',number_1dp:'Number (1 decimal place)',number_2dp:'Number (2 decimal places)',number_3dp:'Number (3 decimal places)'}[f.v]||'';
      const range=(f.mn!==''||f.mx!=='')?` · range ${esc(f.mn||'…')} to ${esc(f.mx||'…')}`:'';
      const btn=f.v==='datetime_mdy'?'<button type="button" class="minibtn" data-now="'+f.n+'">Now</button>':f.v==='date_mdy'?'<button type="button" class="minibtn" data-now="'+f.n+'">Today</button>':'';
      return `<div class="inline"><input type="text" id="${id}" data-f="${f.n}" value="${esc(v||'')}" aria-label="${esc(short(f.n))}">${btn}</div>${hint||range?`<span class="hint">${esc(hint)}${range}</span>`:''}`;
    }
    case 'notes': return `<textarea id="${id}" data-f="${f.n}" aria-label="${esc(short(f.n))}">${esc(v||'')}</textarea>`;
    case 'yesno': case 'radio':
      return ch.map(([c,l])=>`<label class="opt"><input type="radio" name="${id}" data-f="${f.n}" value="${esc(c)}" ${v===c?'checked':''}><span>${safeHTML(l)}</span></label>`).join('')+`<button type="button" class="reset" data-reset="${f.n}">reset</button>`;
    case 'checkbox':{ const s=VAL[f.n] instanceof Set?VAL[f.n]:new Set();
      return ch.map(([c,l])=>`<label class="opt"><input type="checkbox" data-f="${f.n}" data-code="${esc(c)}" ${s.has(c)?'checked':''}><span>${safeHTML(l)}</span></label>`).join(''); }
    case 'calc': return `<input type="text" class="calc" disabled value="Calculated automatically"><details><summary class="hint">Show formula</summary><code class="mono" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(f.c)}</code></details>`;
    case 'file': return `<div class="inline"><button type="button" class="minibtn" disabled>Upload file</button><span class="hint">File upload</span></div>`;
  }
  return '';
}
function embedInto(html){
  return safeHTML(html).replace(/\{([a-z0-9_]+)\}/g,(m,c)=>{ const f=BY[c]; if(!f) return m;
    if(f.t==='text') return `<input type="text" data-f="${c}" value="${esc(VAL[c]||'')}" title="${esc(c)}" style="width:7em;padding:3px 5px;border:1px solid #b9c1ca;border-radius:4px;background:#fff;color:#1d2329">`;
    return `<span style="display:inline-block">${inputHTML(f)}</span>`; });
}
function commentBox(k,form,inPaper){
  const list=commentsFor(k), mineObj=(C.docs[C.me]&&C.docs[C.me].notes&&C.docs[C.me].notes[k])||null;
  const others=list.filter(c=>c.uid!==C.me).map(c=>`<div class="cmt"><div class="who">${esc(nm(c.uid))} <span>· ${esc(when(c.at))}</span></div><div class="txt">${esc(c.t)}</div></div>`).join('');
  let editor='';
  if(!C.db){ editor=`<div class="status">${esc(C.err||'Comments need you to be signed in to claude.ai. Loading…')}</div>`; }
  else if(C.canWrite===false){ editor=`<div class="status">You can read comments but not add them. Ask the project owner to give you Contributor access.</div>`; }
  else editor=`<textarea data-ck="${esc(k)}" placeholder="Your comment or suggested change…" aria-label="Your comment">${esc(mineObj?mineObj.t:'')}</textarea>
    <div class="acts"><button type="button" class="btn primary" data-save="${esc(k)}">${mineObj?'Update comment':'Save comment'}</button>${mineObj?`<button type="button" class="btn" data-del="${esc(k)}">Delete mine</button><span class="status">Saved ${esc(when(mineObj.at))}</span>`:''}${C.err?`<span class="status" style="color:#b42318">${esc(C.err)}</span>`:''}</div>`;
  return `<div class="cbox">${others||(!mineObj?'<div class="status">No comments yet.</div>':'')}${editor}</div>`;
}
function fieldRow(f,idx){
  const show=shown(f.n), sim=$('sim').checked;
  if(sim&&!show) return '';
  const m=FM[f.m];
  const chip=m?`<span class="chip ${m.k}" title="${esc(m.d)}">${esc(m.t)}</span>`:'';
  const cond=f.b?(AST[f.n]?`<span class="cond"><b>Shown only if</b><span>${desc(AST[f.n],true)}</span></span>`:`<span class="cond"><b>Shown only if</b><span class="mono">${esc(f.b)}</span></span>`):'';
  const kids=Object.entries(EMB).filter(([c,h])=>h===f.n).map(([c])=>c);
  const n=commentsFor(f.n).length;
  const q=$('q').value.trim().toLowerCase();
  const hit=q&&(f.n.toLowerCase().includes(q)||strip(f.l).toLowerCase().includes(q));
  const meta=`<div class="meta"><span class="var">${esc(f.n)}</span>${chip}${f.id==='y'?'<span class="chip Manual">Identifier</span>':''}${cond}${kids.length?`<span>Includes ${kids.length} embedded fields</span>`:''}</div>`;
  const box='';
  const sec=f.s?`<div class="sec">${safeHTML(f.s)}</div>`:'';
  const dim=(!sim&&!show&&f.b)?'':'';
  if(f.t==='descriptive') return sec+`<div class="row desc ${hit?'hit':''}" id="r_${f.n}"><div class="lbl tag-ehrbox">${embedInto(f.l)}</div>${meta}${box}</div>`;
  return sec+`<div class="row ${hit?'hit':''}" id="r_${f.n}"><div class="lbl">${embedInto(f.l)}${f.rq==='y'?'<div class="req">* must provide value</div>':''}</div><div class="inp">${inputHTML(f)}${f.no?`<div class="note">${embedInto(f.no)}</div>`:''}</div>${meta}${box}</div>`;
}
function renderForm(){
  const rows=F.filter(f=>f.f===current&&!EMB[f.n]);
  const s=formStats(current);
  const counts=Object.entries(s).map(([k,v])=>FM[k]?`<span class="chip ${FM[k].k}">${v} ${esc(FM[k].t)}</span>`:'').join('');
  const gk='_form:'+current, gn=commentsFor(gk).length;
  const q=$('q').value.trim().toLowerCase();
  const hits=q?F.filter(f=>f.n.toLowerCase().includes(q)||strip(f.l).toLowerCase().includes(q)):[];
  const elsewhere=q?[...new Set(hits.filter(f=>f.f!==current).map(f=>f.f))]:[];
  let html=`<div class="formhead"><h2>${esc(TITLE(current))}</h2><span class="mono">${esc(current)}</span><div class="counts">${counts}</div></div>`;
  if(q) html+=`<div class="notice"><b>${hits.filter(f=>f.f===current).length}</b> matches in this instrument${elsewhere.length?' · also in: '+elsewhere.map(f=>`<a href="#${f}" data-go="${f}" style="color:var(--accent)">${esc(TITLE(f))}</a>`).join(', '):''}</div>`;
  html+=`<div class="notice"><b>Suggesting a change?</b> Email Luiz with the instrument name and the field's variable name (the grey box under each field), then describe the change.</div>`;
  const body=rows.map(fieldRow).join('');
  html+=`<div class="paper">${body||'<div class="empty">No fields are shown with the current answers. Turn off “Apply branching” to see every field.</div>'}<div class="formfoot"><b>Form status</b><span class="hint">Complete?</span><select aria-label="Form status"><option>Incomplete</option><option>Unverified</option><option>Complete</option></select><span class="hint">Answers you click here are only for trying the form; they are not saved.</span></div></div>`;
  $('view').innerHTML=html;
}
function renderAll(){
  const byForm={};
  for(const [uid,d] of Object.entries(C.docs)){ for(const [k,x] of Object.entries((d&&d.notes)||{})){ if(!x||!x.t) continue;
    const form=k.startsWith('_form:')?k.slice(6):(BY[k]&&BY[k].f); if(!form) continue;
    (byForm[form]=byForm[form]||{}); (byForm[form][k]=byForm[form][k]||[]).push({uid,t:x.t,at:x.at}); } }
  const total=Object.values(byForm).reduce((a,o)=>a+Object.values(o).reduce((b,l)=>b+l.length,0),0);
  let html=`<div class="formhead"><h2>All comments</h2><span class="mono">${total} comment${total===1?'':'s'}</span><div class="counts"><button type="button" class="btn" id="dl">Download as CSV</button></div></div>`;
  if(!C.db) html+=`<div class="notice">${esc(C.err||'Comments load once you are signed in to claude.ai.')}</div>`;
  else if(!total) html+=`<div class="notice"><b>No comments yet.</b> Open an instrument and use the <b>Comment</b> button on any field, or comment on the instrument as a whole.</div>`;
  html+='<div class="allc">'+FORMS.filter(f=>byForm[f]).map(form=>{
    const items=Object.entries(byForm[form]).sort((a,b)=>{const ia=F.findIndex(x=>x.n===a[0]), ib=F.findIndex(x=>x.n===b[0]); return ia-ib;});
    return `<section class="grp"><h3><span>${esc(TITLE(form))}</span><span class="mono">${items.reduce((a,[,l])=>a+l.length,0)}</span></h3>`+items.map(([k,l])=>{
      const isForm=k.startsWith('_form:');
      const head=isForm?'<b>Instrument as a whole</b>':`<a data-jump="${k}">${esc(short(k))}</a><span class="mono" style="color:var(--muted)">${esc(k)}</span>`;
      return `<div class="item"><div class="fl">${head}</div>${l.sort((a,b)=>String(a.at).localeCompare(String(b.at))).map(c=>`<div class="cmt"><div class="who">${esc(nm(c.uid))} <span>· ${esc(when(c.at))}</span></div><div class="txt">${esc(c.t)}</div></div>`).join('')}</div>`;
    }).join('')+'</section>';
  }).join('')+'</div>';
  $('view').innerHTML=html;
}
function render(){
  nav();
  renderForm();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.form){ mode='form'; current=t.dataset.form; open=null; try{history.replaceState(null,'','#'+current);}catch(_){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ e.preventDefault(); mode='form'; current=t.dataset.go; open=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.open){ open=open===t.dataset.open?null:t.dataset.open; render(); const ta=document.querySelector(`textarea[data-ck="${CSS.escape(t.dataset.open)}"]`); if(ta) ta.focus(); return; }
  if(t.dataset.save){ const ta=document.querySelector(`textarea[data-ck="${CSS.escape(t.dataset.save)}"]`); C.err=''; saveMine(t.dataset.save,ta?ta.value:''); render(); return; }
  if(t.dataset.del){ C.err=''; saveMine(t.dataset.del,''); render(); return; }
  if(t.dataset.reset){ delete VAL[t.dataset.reset]; render(); return; }
  if(t.dataset.now){ const f=BY[t.dataset.now]; const d=new Date(), p=x=>String(x).padStart(2,'0');
    VAL[f.n]=`${p(d.getMonth()+1)}-${p(d.getDate())}-${d.getFullYear()}`+(f.v==='datetime_mdy'?` ${p(d.getHours())}:${p(d.getMinutes())}`:''); render(); return; }
  if(t.dataset.jump){ const f=BY[t.dataset.jump]; mode='form'; current=f.f; open=f.n; $('sim').checked=false; render(); const r=$('r_'+f.n); if(r) r.scrollIntoView({block:'center'}); return; }
  if(t.id==='allBtn'){ mode='all'; open=null; render(); window.scrollTo(0,0); return; }
  if(t.id==='dl'){ downloadCSV(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='navsel'){ if(t.value==='__all'){mode='all';} else {mode='form'; current=t.value;} open=null; render(); window.scrollTo(0,0); return; }
  if(t.id==='sim'){ render(); return; }
  const n=t.dataset&&t.dataset.f; if(!n) return;
  if(t.type==='checkbox'){ const s=VAL[n] instanceof Set?VAL[n]:new Set(); t.checked?s.add(t.dataset.code):s.delete(t.dataset.code); VAL[n]=s; }
  else VAL[n]=t.value;
  if($('sim').checked||Object.values(AST).length) { const y=window.scrollY; render(); window.scrollTo(0,y); }
});
let qt; $('q').addEventListener('input',()=>{ clearTimeout(qt); qt=setTimeout(()=>{ if(mode!=='form'){mode='form';} const q=$('q').value.trim().toLowerCase();
  if(q){ const inCur=F.some(f=>f.f===current&&(f.n.toLowerCase().includes(q)||strip(f.l).toLowerCase().includes(q))); if(!inCur){ const f=F.find(f=>f.n.toLowerCase().includes(q)||strip(f.l).toLowerCase().includes(q)); if(f) current=f.f; } }
  render(); const h=document.querySelector('.row.hit'); if(h) h.scrollIntoView({block:'center'}); },250); });

async function downloadCSV(){
  const rows=[['Instrument','Variable','Field label','Fill method','Commenter','Date','Comment']];
  for(const [uid,d] of Object.entries(C.docs)){ for(const [k,x] of Object.entries((d&&d.notes)||{})){ if(!x||!x.t) continue;
    const isForm=k.startsWith('_form:'); const f=isForm?null:BY[k]; const form=isForm?k.slice(6):(f&&f.f);
    rows.push([TITLE(form||''),isForm?'(instrument)':k,isForm?'':strip(f&&f.l),f?f.m:'',uid===C.me?(C.names[uid]||'Me'):(C.names[uid]||'Team member'),x.at||'',x.t]); } }
  const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  try{ const dl=await claude.use('downloads'); if(!dl){ C.err='Download is not available in this view.'; render(); return; }
    await dl.save({filename:'OMEGA_REDCap_review_comments.csv',data:'﻿'+csv}); }
  catch(e){ if(e&&e.code!=='declined'){ C.err='Download failed: '+(e.message||e.code); render(); } }
}

/* ---------- boot ---------- */
legend(); render();
})();
